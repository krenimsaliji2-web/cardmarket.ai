name: project-atlas

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # DATABASE_URL wird bewusst hier aus den MARIADB_*-Variablen
      # zusammengesetzt (der App-Code liest weiterhin exakt
      # process.env.DATABASE_URL, nur der WERT wird für den
      # Container-Kontext automatisch auf den internen MariaDB-
      # Servicenamen gesetzt, statt ihn manuell doppelt in .env pflegen zu
      # müssen). Ein evtl. in .env gesetzter roher DATABASE_URL-Wert (für
      # lokale Entwicklung ohne Docker) wird hier bewusst überschrieben –
      # `environment:` hat in Docker Compose Vorrang vor `env_file:`.
      DATABASE_URL: mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb:3306/${MARIADB_DATABASE}
      # Gleiches Prinzip für Redis: intern immer über den Servicenamen,
      # unabhängig vom REDIS_URL-Wert in .env (der für lokale Entwicklung
      # ohne Docker gilt).
      REDIS_URL: redis://redis:6379
    volumes:
      - uploads_data:/app/public/uploads
      - invoices_data:/app/public/invoices
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
      - "3001"
    # Kein Ports-Mapping nach außen ("Nur notwendige Ports freigeben") – der
    # App-Container ist ausschließlich über nginx erreichbar.

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
      - "3306"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    expose:
      - "6379"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt

volumes:
  mariadb_data:
  uploads_data:
  invoices_data:
  certbot_webroot:
  certbot_certs:
