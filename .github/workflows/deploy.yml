name: Deploy to Vercel

# Deployt bei jedem Push auf main automatisch nach Vercel (kein Docker, kein
# eigener Server, kein Port-Management – Next.js läuft direkt als
# Vercel-Deployment). Offizielles Vercel-CI/CD-Muster über die Vercel-CLI.
#
# Voraussetzungen (einmalig):
#   1. Vercel-Account, Projekt mit diesem Repo verknüpft (vercel.com -> Add
#      New Project -> GitHub-Repo auswählen). Next.js wird automatisch
#      erkannt, kein Konfigurationsaufwand.
#   2. Alle Umgebungsvariablen aus .env.example im Vercel-Projekt hinterlegen
#      (Project Settings -> Environment Variables) – DATABASE_URL,
#      BETTER_AUTH_SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, REDIS_URL
#      usw. Vercel selbst hostet keine Datenbank/Redis – dafür einen
#      externen, ebenfalls serverlosen Dienst verwenden (z. B. Neon für
#      Postgres, Upstash für Redis).
#   3. Repository-Secrets hier bei GitHub setzen (Settings -> Secrets and
#      variables -> Actions):
#        VERCEL_TOKEN        Erzeugen unter vercel.com/account/tokens
#        VERCEL_ORG_ID       Aus `vercel link` (lokal einmal ausführen) bzw.
#        VERCEL_PROJECT_ID   aus den Vercel-Projekteinstellungen
#
# Wichtige Einschränkung: services/jobs/worker.ts (Background-Jobs) und
# services/realtime/server.ts (WebSocket-Server) sind dauerhaft laufende
# Node-Prozesse – Vercel führt ausschließlich kurzlebige Serverless-
# Funktionen aus, kann solche Prozesse also NICHT hosten. Checkout,
# Marketplace, Login und Chat funktionieren trotzdem (bestehende
# Timeout-Fallback-Architektur, siehe README "Redis & Queue"), aber
# Hintergrund-Jobs (Preisalarme, E-Mail-Versand, Realtime-Chat-Push) bleiben
# inaktiv, bis Worker/Realtime-Server auf einem separaten Dienst laufen.

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Vercel-CLI installieren
        run: npm install --global vercel@latest

      - name: Vercel-Projektumgebung laden
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
