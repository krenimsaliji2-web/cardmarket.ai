# Project Atlas – nginx Hauptkonfiguration (Feature 86).
# Server-/Location-Blöcke stehen in nginx/templates/app.conf.template
# (Domain wird dort per envsubst aus der Umgebungsvariable DOMAIN
# eingesetzt, siehe docker-compose.yml und README "HTTPS").

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout  65;

  # Große Uploads (Listing-Bilder, siehe services/storage/LocalStorageProvider.ts
  # – Grenze dort ist bereits serverseitig auf 10 MB validiert, siehe
  # lib/validation/listingImages.ts; hier bewusst etwas großzügiger, damit
  # nginx nicht schon vor der eigentlichen Anwendungsvalidierung abbricht).
  client_max_body_size 15m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;

  include /etc/nginx/conf.d/*.conf;
}
